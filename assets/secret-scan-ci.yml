# secret-scan-ci.yml — 在 CI 中阻断新密钥泄露
#
# 用法（GitHub Actions 示例）：
#   将本文件放入 .github/workflows/secret-scan.yml，或抽取 steps 段并入现有流水线。
#   配套脚本：scripts/secret_scan.py（零依赖、纯标准库、离线可用）
#
# 行为：
#   - push / PR 时扫描变更范围（默认全仓，可用 paths 限定）
#   - --strict 模式下发现任何真阳性即非零退出，阻断合并
#   - --write-baseline 用于首次接入时生成已知误报基线（secret-baseline.json）

name: secret-scan

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史时去掉本行以加速

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run secret scanner (block on true positives)
        run: |
          python3 scripts/secret_scan.py . \
            --strict \
            --baseline secret-baseline.json \
            --json secret-scan-report.json || exit 1

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: secret-scan-report.json

# 首次接入建议：
#   1) 本地跑  python3 scripts/secret_scan.py . --write-baseline secret-baseline.json
#      把已确认的误报/历史遗留固化进基线，避免流水线误伤。
#   2) 接入流水线，仅对新增命中（非基线内）报错。
#   3) 真有泄露：先轮换/撤销密钥，再清理历史（git-filter-repo），最后解除基线。
