# security-headers.conf — Nginx 安全响应头示例
#
# 用法：在 server {} 或 location / {} 块内 include 本文件，
#       或将其内容直接粘贴。配套方法论见 references/web-hardening.md。
# 注意：CSP 上线前务必先用 Report-Only 观察，再切到强制策略（见文末注释）。

# --- HSTS：确认全站 HTTPS 且无法回退后再上调 max-age ---
# 不可逆阶梯：先 300 → 确认稳定 → 2592000 → 确认无混合内容 → 31536000; preload
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# --- CSP：默认先 Report-Only 观察 1~2 周，再改为 Content-Security-Policy ---
# add_header Content-Security-Policy-Report-Only "
#   default-src 'self';
#   script-src 'self';
#   style-src 'self' 'unsafe-inline';
#   img-src 'self' data:;
#   font-src 'self';
#   connect-src 'self';
#   object-src 'none';
#   base-uri 'self';
#   form-action 'self';
#   frame-ancestors 'none';
# " always;

# 上线时把上面改为（去掉 -Report-Only）：
# add_header Content-Security-Policy "default-src 'self'; script-src 'self'; ..." always;

# --- 防点击劫持 ---
add_header X-Frame-Options "DENY" always;          # 等效于 CSP frame-ancestors 'none'
add_header Content-Security-Policy "frame-ancestors 'none'" always;  # 现代等价

# --- MIME / 嗅探防护 ---
add_header X-Content-Type-Options "nosniff" always;

# --- 关闭 Referrer 泄露 ---
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# --- 限定来源特性（可选，按业务裁剪） ---
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# --- 信息泄露收敛：去掉版本号与后端标识 ---
server_tokens off;
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
more_clear_headers "X-Powered-By";   # 需 ngx_headers_more 模块；无则删除此行
